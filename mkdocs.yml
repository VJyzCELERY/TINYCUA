# MkDocs configuration for TinyCUA SDK

site_name: TinyCUA SDK
site_description: AI Agent Development Kit
site_url: https://github.com/tinycua/tinycua-sdk
site_author: TinyCUA Team

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
    - scheme: slate
      primary: blue
      accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source

nav:
  - Home: index.md
  - API:
      - api/tinycua_sdk.md
      - api/tinycua.md
  - Guides:
      - guides/migration.md
      - guides/agent-development.md
      - guides/skills.md
      - guides/context-management.md
      - guides/middleware.md
  - Examples:
      - examples/agent_basic.md
      - examples/agent_with_skills.md
      - examples/agent_with_hooks.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
