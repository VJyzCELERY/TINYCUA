[tool.ruff]
line-length = 88
select = ["E", "W", "F", "D", "C901"] # C901 enforces McCabe complexity limit
ignore = []
fixable = ["ALL"] # Enable auto-fixing

[tool.ruff.lint.mccabe]
max-complexity = 15 # Max cognitive complexity per function

[lint.flake8-tidy-imports]
ban-relative-imports = "all" # Absolute imports only

[lint.per-file-ignores]
"**/tests/**" = ["D"] # Skip docstring rules for tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings --maxfail=2 --cov=sub_project --cov-report=html"
