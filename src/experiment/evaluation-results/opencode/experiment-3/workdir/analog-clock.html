<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: Arial, sans-serif;
    }

    .clock {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: white;
      box-shadow: 
        inset -10px -10px 20px rgba(0,0,0,0.1),
        inset 10px 10px 20px rgba(255,255,255,0.9),
        0 20px 60px rgba(0,0,0,0.3);
      position: relative;
    }

    .center-dot {
      width: 12px;
      height: 12px;
      background: #764ba2;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      border-radius: 4px;
      transform-origin: bottom center;
      transition: transform 0.05s cubic-bezier(0.4, 2.3, 0.5, 1);
    }

    .hour-hand {
      width: 6px;
      height: 70px;
      background: #333;
      margin-left: -3px;
      transform-origin: bottom center;
      transition: transform 0.5s cubic-bezier(0.4, 2.3, 0.5, 1);
    }

    .minute-hand {
      width: 4px;
      height: 90px;
      background: #667eea;
      margin-left: -2px;
      transform-origin: bottom center;
      transition: transform 0.5s cubic-bezier(0.4, 2.3, 0.5, 1);
    }

    .second-hand {
      width: 2px;
      height: 100px;
      background: #e74c3c;
      margin-left: -1px;
      transform-origin: bottom center;
      transition: transform 0.05s linear;
    }

    .marker {
      position: absolute;
      width: 8px;
      height: 2px;
      background: #333;
      left: calc(50% - 4px);
      top: 10px;
      transform-origin: center bottom;
    }

    .digital-time {
      position: absolute;
      bottom: -60px;
      font-size: 28px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .am-pm {
      position: absolute;
      bottom: -75px;
      font-size: 16px;
      color: #ddd;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    @keyframes tick {
      from { transform: rotate(var(--tick-rotation)); }
      to { transform: rotate(calc(var(--tick-rotation) + var(--tick-duration))); }
    }
  </style>
</head>
<body>
  <div class="clock">
    <!-- Hour markers -->
    <div class="marker" style="--tick-rotation: 0deg;"></div>
    <div class="marker" style="--tick-rotation: 30deg; width: 12px;"></div>
    <div class="marker" style="--tick-rotation: 60deg;"></div>
    <div class="marker" style="--tick-rotation: 90deg; width: 12px;"></div>
    <div class="marker" style="--tick-rotation: 120deg;"></div>
    <div class="marker" style="--tick-rotation: 150deg;"></div>
    <div class="marker" style="--tick-rotation: 180deg; width: 12px;"></div>
    <div class="marker" style="--tick-rotation: 210deg;"></div>
    <div class="marker" style="--tick-rotation: 240deg;"></div>
    <div class="marker" style="--tick-rotation: 270deg; width: 12px;"></div>
    <div class="marker" style="--tick-rotation: 300deg;"></div>
    <div class="marker" style="--tick-rotation: 330deg;"></div>

    <!-- Hands -->
    <div id="hour-hand" class="hand hour-hand"></div>
    <div id="minute-hand" class="hand minute-hand"></div>
    <div id="second-hand" class="hand second-hand"></div>
    
    <div class="center-dot"></div>

    <!-- Digital display -->
    <div id="digital-time" class="digital-time">12:00</div>
    <div id="am-pm" class="am-pm">AM</div>
  </div>

  <script>
    const hourHand = document.getElementById('hour-hand');
    const minuteHand = document.getElementById('minute-hand');
    const secondHand = document.getElementById('second-hand');
    const digitalTime = document.getElementById('digital-time');
    const amPm = document.getElementById('am-pm');

    function updateClock() {
      const now = new Date();
      
      // Get current time values
      let hours = now.getHours() % 12 || 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const ampm = now.getHours() >= 12 ? 'PM' : 'AM';

      // Calculate rotation angles
      const secondDegrees = (seconds / 60) * 360;
      const minuteDegrees = ((minutes % 60) / 60) * 360 + (seconds / 60) * 6;
      const hourDegrees = ((hours % 12) / 12) * 360 + (minutes / 60) * 30;

      // Apply rotations with smooth animation
      secondHand.style.transform = `rotate(${secondDegrees}deg)`;
      minuteHand.style.transform = `rotate(${minuteDegrees}deg)`;
      hourHand.style.transform = `rotate(${hourDegrees}deg)`;

      // Update digital display
      const hoursStr = hours.toString().padStart(2, '0');
      const minutesStr = minutes.toString().padStart(2, '0');
      digitalTime.textContent = `${hoursStr}:${minutesStr}`;
      amPm.textContent = ampm;

      requestAnimationFrame(updateClock);
    }

    // Start the clock animation loop
    updateClock();
  </script>
</body>
</html>
