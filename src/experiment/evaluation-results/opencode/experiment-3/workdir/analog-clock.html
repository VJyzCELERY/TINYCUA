<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .clock {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: white;
            box-shadow: 
                inset -10px -10px 20px rgba(0, 0, 0, 0.1),
                inset 10px 10px 20px rgba(255, 255, 255, 0.9),
                0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .clock-face {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
        }

        .number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 5px;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
        }

        .hour-hand {
            width: 8px;
            height: 70px;
            background: #333;
            margin-left: -4px;
        }

        .minute-hand {
            width: 6px;
            height: 100px;
            background: #555;
            margin-left: -3px;
        }

        .second-hand {
            width: 2px;
            height: 120px;
            background: #e74c3c;
            margin-left: -1px;
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .clock-face::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            width: 4px;
            height: 10px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::after {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 4px;
            height: 10px;
            background: #333;
            transform: translateX(-50%);
        }

        .digital-time {
            position: absolute;
            bottom: -60px;
            font-size: 28px;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .date {
            position: absolute;
            top: -65px;
            font-size: 24px;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .clock-face::after {
            content: '';
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::after {
            content: '';
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::after {
            content: '';
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::after {
            content: '';
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::after {
            content: '';
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        .clock-face::after {
            content: '';
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 4px;
            height: 8px;
            background: #333;
            transform: translateX(-50%);
        }

        @keyframes tick {
            0%, 16.66% { background-color: rgba(255, 255, 255, 0.9) !important; }
            33.33% { background-color: rgba(240, 240, 240, 1) !important; }
        }

        .tick-animation {
            animation: tick 1s ease-in-out infinite;
        }

        @keyframes second-tick {
            0%, 9.5% { background-color: #e74c3c !important; border-right: none;}
            16.66% { background-color: rgba(231, 76, 60, 0.8) !important; }
        }

        .second-hand.tick-animating {
            animation: second-tick 1s ease-in-out infinite;
        }

        @keyframes hour-pulse {
            0%, 95% { background-color: #333; border-right: none;}
            100% { background-color: rgba(51, 51, 51, 0.8); }
        }

        .hour-hand.pulse-animating {
            animation: hour-pulse 4s ease-in-out infinite;
        }

        @keyframes minute-sweep {
            0%, 97% { background-color: #555; border-right: none;}
            100% { background-color: rgba(85, 85, 85, 0.8); }
        }

        .minute-hand.sweep-animating {
            animation: minute-sweep 60s linear infinite;
        }

    </style>
</head>
<body>
    <div class="clock">
        <div class="date" id="date"></div>
        <div class="digital-time" id="time"></div>
        
        <div class="clock-face">
            <!-- Numbers 1-12 -->
            <div class="number" style="transform: rotate(0deg)">1</div>
            <div class="number" style="transform: rotate(30deg)">2</div>
            <div class="number" style="transform: rotate(60deg)">3</div>
            <div class="number" style="transform: rotate(90deg)">4</div>
            <div class="number" style="transform: rotate(120deg)">5</div>
            <div class="number" style="transform: rotate(150deg)">6</div>
            <div class="number" style="transform: rotate(180deg)">7</div>
            <div class="number" style="transform: rotate(210deg)">8</div>
            <div class="number" style="transform: rotate(240deg)">9</div>
            <div class="number" style="transform: rotate(270deg)">10</div>
            <div class="number" style="transform: rotate(300deg)">11</div>
            <div class="number" style="transform: rotate(330deg)">12</div>

            <!-- Hands -->
            <div class="hand hour-hand pulse-animating" id="hourHand"></div>
            <div class="hand minute-hand sweep-animating" id="minuteHand"></div>
            <div class="hand second-hand tick-animating" id="secondHand"></div>

            <!-- Center dot -->
            <div class="center-dot"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Get current time values (0-59 for seconds, 12 or 60)
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            let hours = now.getHours();

            // Calculate degrees
            const secondDeg = ((seconds / 60) * 360);
            const minuteDeg = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            const hourDeg = ((hours % 12 / 12) * 360) + ((minutes / 60) * 30);

            // Update hands with smooth animation
            document.getElementById('secondHand').style.transform = 
                `translateX(-50%) rotate(${secondDeg}deg)`;
            
            document.getElementById('minuteHand').style.transform = 
                `translateX(-50%) rotate(${minuteDeg}deg)`;
            
            document.getElementById('hourHand').style.transform = 
                `translateX(-50%) rotate(${hourDeg}deg)`;

            // Update digital time display
            const hoursStr = hours % 12 || 12;
            const minutesStr = String(minutes).padStart(2, '0');
            document.getElementById('time').textContent = 
                `${hoursStr}:${minutesStr}`;

            // Update date display
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                          'July', 'August', 'September', 'October', 'November', 'December'];
            
            document.getElementById('date').textContent = 
                `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
        }

        // Update clock every second with animation reset for smooth sweep effect
        setInterval(updateClock, 100);
        
        // Initial update
        updateClock();
    </script>
</body>
</html>
