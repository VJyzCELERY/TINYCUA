<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - {{ APP_NAME }}</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/static/css/styles.css">
  
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 64px);
      padding: var(--spacing-md);
    }

    .login-card {
      background-color: var(--bg-primary);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      padding: var(--spacing-xl);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }

    .logo-icon {
      font-size: 32px;
      display: block;
      margin-bottom: var(--spacing-sm);
    }

    h1.login-title {
      font-size: 24px;
      color: var(--text-primary);
      margin-bottom: var(--spacing-xs);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label.form-label {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="email"],
    input[type="password"] {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring-color);
    }

    button.primary-btn {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-blue);
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    button.primary-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .login-footer {
      text-align: center;
      margin-top: var(--spacing-md);
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body class="light">
  <div class="login-container">
    <form class="login-card" id="login-form" action="/api/v1/auth/login" method="POST">
      
      <div class="login-header">
        <span class="logo-icon">📝</span>
        <h1 class="login-title">Welcome Back</h1>
        <p style="color:var(--text-secondary);font-size:14px;">Sign in to your account</p>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" required minlength="8" placeholder="Enter your password">
      </div>

      <button type="submit" class="primary-btn">Sign In</button>
      
      <!-- Error message display -->
      {% if error %}
        <p style="color:var(--accent-red);font-size:13px;margin-top:8px;">{{ error }}</p>
      {% endif %}

    </form>
  </div>
</body>
</html>
