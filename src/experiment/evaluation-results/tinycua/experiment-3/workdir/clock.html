<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            background-color: white;
        }
    </style>
</head>
<body>
    <canvas id="clock" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('clock');
        const ctx = canvas.getContext('2d');
        
        function drawClock() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 180;
            
            // Draw clock face circle background
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // Draw hour markers (1-12)
            for (let i = 0; i < 12; i++) {
                const angle = (i * Math.PI / 6) - Math.PI / 2; // Start at top, 30 degrees per hour
                
                // Calculate marker position
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                // Draw hour marker line
                ctx.beginPath();
                ctx.moveTo(centerX + (radius - 15) * Math.cos(angle), centerY + (radius - 15) * Math.sin(angle));
                ctx.lineTo(x, y);
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                // Draw hour number
                const textAngle = angle - Math.PI / 2;
                const textRadius = radius - 50;
                const textX = centerX + textRadius * Math.cos(angle);
                const textY = centerY + textRadius * Math.sin(angle);
                
                ctx.save();
                ctx.translate(textX, textY);
                ctx.rotate(angle);
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'right';
                ctx.fillStyle = '#333333';
                ctx.fillText(i + 1, -8, 6); // Position text to the left of marker
                ctx.restore();
            }
            
            // Draw center dot
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#333333';
            ctx.fill();
            
            // Get current time for hands rotation
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();
            
            // Calculate hour hand angle (moves continuously with minutes)
            const hourAngle = ((hours * 30) + (minutes / 60) * 30) * Math.PI / 180;
            
            // Draw hour hand
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(
                centerX - radius * 0.5 * Math.cos(hourAngle), 
                centerY - radius * 0.5 * Math.sin(hourAngle)
            );
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            // Calculate minute hand angle (moves continuously with seconds)
            const minuteAngle = ((minutes * 6) + (seconds / 60) * 6) * Math.PI / 180;
            
            // Draw minute hand
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(
                centerX - radius * 0.45 * Math.cos(minuteAngle), 
                centerY - radius * 0.45 * Math.sin(minuteAngle)
            );
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            // Calculate second hand angle (smooth movement with milliseconds)
            const secondAngle = ((seconds * 6) + (milliseconds / 1000) * 6) * Math.PI / 180;
            
            // Draw second hand
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(
                centerX - radius * 0.52 * Math.cos(secondAngle), 
                centerY - radius * 0.52 * Math.sin(secondAngle)
            );
            ctx.strokeStyle = '#ff3b3b';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();
        }
        
        // Real-time update using setInterval to refresh clock every second
        setInterval(drawClock, 1000);
    </script>
</body>
</html>
