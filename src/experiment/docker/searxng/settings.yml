use_default_settings: true

server:
  secret_key: tinycua-experiment
  bind_address: 0.0.0.0
  port: 8080
  limiter: false

search:
  formats:
    - html
    - json

# Outgoing HTTP client tuning. Lower per-request timeout so a dead/slow
# engine fails fast instead of holding its slot — the aggregate query
# returns partial results from whichever engines are responsive, instead
# of waiting on the slowest one and hitting the client timeout.
outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0

# Enable a broad engine set so a few rate-limited/CAPTCHA'd upstreams
# under rapid-fire query load still leave partial results. Each entry
# merges over the default engine definition with the same `name`.
# General (10), IT (4), Science/Wiki (6), News (5) = ~25 engines.
engines:
  # --- general ---
  - name: google
    enabled: true
  - name: bing
    enabled: true
  - name: brave
    enabled: true
  - name: duckduckgo
    enabled: true
  - name: startpage
    enabled: true
  - name: mojeek
    enabled: true
  - name: qwant
    enabled: true
  - name: marginalia
    enabled: true
  - name: yahoo
    enabled: true
  - name: swisscows
    enabled: true
  # --- it ---
  - name: stackoverflow
    enabled: true
  - name: github
    enabled: true
  - name: mdn
    enabled: true
  - name: superuser
    enabled: true
  # --- science / wiki ---
  - name: wikipedia
    enabled: true
  - name: arxiv
    enabled: true
  - name: google scholar
    enabled: true
  - name: pubmed
    enabled: true
  - name: openalex
    enabled: true
  - name: springer nature
    enabled: true
  # --- news ---
  - name: bing news
    enabled: true
  - name: google news
    enabled: true
  - name: duckduckgo news
    enabled: true
  - name: yahoo news
    enabled: true
  - name: reuters
    enabled: true
  # --- explicitly disabled (3rd-party blocks on shared public IP) ---
  - name: wikidata
    enabled: false
