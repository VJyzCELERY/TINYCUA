[project]
name = "tinycua-agent-harness-experiment"
version = "0.1.0"
description = "Minimal runner for comparing agent harnesses."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --maxfail=2"
