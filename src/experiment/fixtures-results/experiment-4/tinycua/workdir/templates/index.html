<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion-like App</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #373e51;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .block {
            padding: 8px 0;
            position: relative;
            transition: background-color 0.2s;
        }
        .block:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }
        .block.selected {
            background-color: #e3fdfd;
            border-left: 3px solid #2eaadc;
        }
        .block-content {
            width: 100%;
            min-height: 24px;
            padding: 4px 8px;
            border: none;
            outline: none;
            font-size: 16px;
            line-height: 1.5;
            background: transparent;
            resize: vertical;
            min-height: 24px;
        }
        .block-content:focus {
            background-color: #fff;
        }
        .controls {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-primary {
            background-color: #2eaadc;
            color: white;
        }
        .btn-danger {
            background-color: #ff5c5c;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8c8c8c;
        }
        .instructions {
            font-size: 12px;
            color: #8c8c8c;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Notion-like App</h1>
        <div id="blocks-container">
            <div class="empty-state" id="empty-state">
                No blocks yet. Click "+" below to add your first block.
            </div>
        </div>
        <div class="instructions" id="instructions"></div>
        <div class="controls" id="controls" style="display: none;">
            <button class="btn btn-primary" id="add-block-btn">+ Add Block</button>
            <button class="btn btn-danger" id="clear-all-btn">Clear All</button>
        </div>
    </div>

    <script>
        let blocks = [];
        let selectedBlockId = null;

        // Load blocks on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/blocks');
                blocks = await response.json();
                renderBlocks();
                
                if (blocks.length > 0) {
                    document.getElementById('empty-state').style.display = 'none';
                    document.getElementById('controls').style.display = 'block';
                    document.getElementById('instructions').textContent = 
                        'Click a block to edit it. Select a block and press Backspace/Delete to delete it.';
                } else {
                    document.getElementById('controls').style.display = 'block';
                    document.getElementById('instructions').textContent = 
                        'Click "+" below to add your first block.';
                }
            } catch (error) {
                console.error('Failed to load blocks:', error);
            }
        });

        // Render blocks in DOM
        function renderBlocks() {
            const container = document.getElementById('blocks-container');
            container.innerHTML = '';

            if (blocks.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                return;
            }
            document.getElementById('empty-state').style.display = 'none';

            blocks.forEach(block => {
                const div = document.createElement('div');
                div.className = 'block' + (selectedBlockId === block.id ? ' selected' : '');
                div.dataset.id = block.id;
                
                const textarea = document.createElement('textarea');
                textarea.className = 'block-content';
                textarea.value = block.content || '';
                textarea.placeholder = 'Type something...';
                
                // Handle textarea events
                textarea.addEventListener('focus', () => selectBlock(block.id));
                textarea.addEventListener('blur', () => saveBlock(block.id));
                textarea.addEventListener('keydown', (e) => handleKeydown(e, block.id));
                
                div.appendChild(textarea);
                container.appendChild(div);
            });
        }

        // Select a block
        function selectBlock(id) {
            selectedBlockId = id;
            renderBlocks();
            
            // Focus the textarea for the selected block
            const textarea = document.querySelector(`.block[data-id="${id}"] textarea`);
            if (textarea) {
                textarea.focus();
            }
        }

        // Save block content
        function saveBlock(id) {
            const textarea = document.querySelector(`.block[data-id="${id}"] textarea`);
            if (!textarea) return;
            
            const content = textarea.value.trim();
            fetch(`/api/blocks/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content || '' })
            }).catch(console.error);

            // Deselect after save
            selectedBlockId = null;
            renderBlocks();
        }

        // Handle keyboard events for accessible controls
        function handleKeydown(e, id) {
            const textarea = e.target;

            // Escape to deselect
            if (e.key === 'Escape') {
                e.preventDefault();
                selectedBlockId = null;
                renderBlocks();
                return;
            }

            // Tab to navigate between blocks
            if (e.key === 'Tab') {
                e.preventDefault();
                const allTextareas = document.querySelectorAll('.block-content');
                const currentIndex = Array.from(allTextareas).indexOf(textarea);
                if (currentIndex >= 0 && currentIndex < allTextareas.length - 1) {
                    allTextareas[currentIndex + 1].focus();
                } else if (currentIndex > 0) {
                    allTextareas[currentIndex - 1].focus();
                }
                return;
            }

            // Enter to add new block below current selection
            if (e.key === 'Enter' && e.ctrlKey === false) {
                e.preventDefault();
                const content = textarea.value.trim();
                fetch('/api/blocks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: '' })
                }).then(response => response.json()).then(newBlock => {
                    blocks.push(newBlock);
                    renderBlocks();
                    selectBlock(newBlock.id);
                }).catch(console.error);
            }

            // Delete/Backspace to delete block when empty
            if (e.key === 'Backspace' || e.key === 'Delete') {
                const content = textarea.value.trim();
                if (content === '') {
                    if (confirm('Delete this block?')) {
                        deleteBlock(id);
                    }
                }
            }
        }

        // Add a new block
        document.getElementById('add-block-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/blocks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: '' })
                });
                const newBlock = await response.json();
                blocks.push(newBlock);
                renderBlocks();
                selectBlock(newBlock.id);
            } catch (error) {
                console.error('Failed to add block:', error);
            }
        });

        // Delete a block
        function deleteBlock(id) {
            fetch(`/api/blocks/${id}`, { method: 'DELETE' })
                .then(() => {
                    blocks = blocks.filter(b => b.id !== id);
                    renderBlocks();
                    
                    if (blocks.length === 0) {
                        document.getElementById('empty-state').style.display = 'block';
                        document.getElementById('controls').style.display = 'none';
                        document.getElementById('instructions').textContent = 
                            'Click "+" below to add your first block.';
                    } else {
                        selectedBlockId = null;
                        renderBlocks();
                    }
                })
                .catch(console.error);
        }

        // Clear all blocks
        document.getElementById('clear-all-btn').addEventListener('click', async () => {
            if (confirm('Delete all blocks?')) {
                try {
                    for (const block of blocks) {
                        await fetch(`/api/blocks/${block.id}`, { method: 'DELETE' });
                    }
                    blocks = [];
                    renderBlocks();
                    
                    document.getElementById('empty-state').style.display = 'block';
                    document.getElementById('controls').style.display = 'none';
                    document.getElementById('instructions').textContent = 
                        'Click "+" below to add your first block.';
                } catch (error) {
                    console.error('Failed to clear blocks:', error);
                }
            });
        });

        // Handle page unload - save any pending changes
        window.addEventListener('beforeunload', () => {
            if (selectedBlockId !== null) {
                saveBlock(selectedBlockId);
            }
        });
    </script>
</body>
</html>
