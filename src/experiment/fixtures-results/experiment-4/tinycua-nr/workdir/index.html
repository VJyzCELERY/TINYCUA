<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion-like Web App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f7f8f9;
            color: #373a40;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #172b4d;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            align-items: center;
            gap: 10px;
        }

        .toolbar button {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #adb5bd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toolbar button:hover {
            background: #edf2f5;
        }

        .toolbar button:focus {
            outline: 2px solid #006621;
            outline-offset: 2px;
        }

        .toolbar label {
            font-size: 14px;
            font-weight: 500;
        }

        .toolbar input[type="text"] {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #adb5bd;
            border-radius: 6px;
            min-width: 200px;
        }

        .block-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .block {
            padding: 12px 16px;
            background: white;
            border: 2px solid #e1e4e8;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .block:hover {
            border-color: #b0b7b9;
        }

        .block:focus {
            outline: none;
            border-color: #006621;
            box-shadow: 0 0 0 3px rgba(0, 102, 33, 0.2);
        }

        .block.selected {
            border-color: #006621;
            background-color: #f0fdf4;
        }

        .block-content {
            flex: 1;
            word-break: break-word;
            min-height: 1.5em;
        }

        .block-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .block:hover .block-actions,
        .block.selected .block-actions {
            opacity: 1;
        }

        .block-action-btn {
            padding: 4px 8px;
            font-size: 12px;
            border: 1px solid #adb5bd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .block-action-btn:hover {
            background: #edf2f5;
        }

        .block-action-btn:focus {
            outline: 2px solid #006621;
            outline-offset: 2px;
        }

        .block-action-btn.delete:hover {
            background: #ffeef0;
        }

        .block-action-btn.edit {
            background: #f0fdf4;
        }

        .block-action-btn.delete:hover {
            border-color: #dc3545;
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            color: #495057;
        }

        .instructions h3 {
            margin-top: 0;
            font-size: 1rem;
        }

        .instructions ul {
            margin: 0;
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 6px;
        }

        .status {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status.visible {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <h1>Notion-like Web App</h1>

    <div class="toolbar">
        <button id="addBlockBtn" aria-label="Add new block">+ Add Block</button>
        
        <label for="blockContentInput" id="contentLabel">Block Content:</label>
        <input type="text" id="blockContentInput" placeholder="Enter text..." aria-label="Block content input">
        
        <button id="saveBtn" aria-label="Save block changes">Save</button>
        <button id="deleteSelectedBtn" aria-label="Delete selected block">Delete Selected</button>
    </div>

    <div id="blockList" class="block-list" role="list" aria-label="Blocks list"></div>

    <div class="status" id="statusMessage" aria-live="polite"></div>

    <div class="instructions">
        <h3>Keyboard Controls</h3>
        <ul>
            <li><strong>Tab:</strong> Navigate between controls and blocks</li>
            <li><strong>Enter/Space:</strong> Select a block (when focused)</li>
            <li><strong>Arrow Up/Down:</strong> Navigate between blocks</li>
            <li><strong>Enter:</strong> Edit selected block content</li>
            <li><strong>Delete/Backspace:</strong> Delete selected block</li>
            <li><strong>Escape:</strong> Cancel editing</li>
        </ul>
    </div>

    <script>
        const API_BASE = '';
        
        // State
        let blocks = [];
        let nextOrder = 0;
        let selectedBlockId = null;
        let isEditing = false;

        // DOM elements
        const blockListEl = document.getElementById('blockList');
        const addBlockBtn = document.getElementById('addBlockBtn');
        const contentInput = document.getElementById('blockContentInput');
        const saveBtn = document.getElementById('saveBtn');
        const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
        const statusMessage = document.getElementById('statusMessage');
        const contentLabel = document.getElementById('contentLabel');

        // API functions
        async function fetchBlocks() {
            try {
                const response = await fetch(API_BASE + '/blocks');
                if (!response.ok) throw new Error('Failed to fetch blocks');
                const data = await response.json();
                blocks = data.blocks;
                nextOrder = data.next_order || 0;
                renderBlocks();
            } catch (error) {
                console.error('Error fetching blocks:', error);
                showStatus('Error loading blocks. Please refresh.', 'error');
            }
        }

        async function createBlock(content, type = 'text') {
            try {
                const response = await fetch(API_BASE + '/blocks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, type })
                });
                if (!response.ok) throw new Error('Failed to create block');
                return await response.json();
            } catch (error) {
                console.error('Error creating block:', error);
                throw error;
            }
        }

        async function updateBlock(blockId, content, type = 'text') {
            try {
                const response = await fetch(API_BASE + `/blocks/${blockId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, type })
                });
                if (!response.ok) throw new Error('Failed to update block');
                return await response.json();
            } catch (error) {
                console.error('Error updating block:', error);
                throw error;
            }
        }

        async function deleteBlock(blockId) {
            try {
                const response = await fetch(API_BASE + `/blocks/${blockId}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to delete block');
                return await response.json();
            } catch (error) {
                console.error('Error deleting block:', error);
                throw error;
            }
        }

        function renderBlocks() {
            if (blocks.length === 0) {
                blockListEl.innerHTML = '<div class="empty-state">No blocks yet. Click "+ Add Block" to create your first block.</div>';
                return;
            }

            blockListEl.innerHTML = '';
            
            blocks.forEach((block, index) => {
                const blockEl = document.createElement('div');
                blockEl.className = 'block' + (selectedBlockId === block.id ? ' selected' : '');
                blockEl.setAttribute('role', 'listitem');
                blockEl.setAttribute('tabindex', selectedBlockId === block.id ? '0' : '-1');
                blockEl.dataset.blockId = block.id;

                const contentSpan = document.createElement('span');
                contentSpan.className = 'block-content';
                contentSpan.textContent = block.content;
                contentSpan.setAttribute('aria-label', `Block ${index + 1} content: ${block.content}`);
                
                blockEl.appendChild(contentSpan);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'block-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'block-action-btn edit';
                editBtn.textContent = 'Edit';
                editBtn.setAttribute('aria-label', `Edit block ${index + 1}`);
                editBtn.addEventListener('click', () => startEditing(block));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'block-action-btn delete';
                deleteBtn.textContent = 'Delete';
                deleteBtn.setAttribute('aria-label', `Delete block ${index + 1}`);
                deleteBtn.addEventListener('click', () => deleteBlockAction(block));

                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(deleteBtn);
                blockEl.appendChild(actionsDiv);
                blockListEl.appendChild(blockEl);
            });

            // Focus first block if none selected
            if (!selectedBlockId && blocks.length > 0) {
                const firstBlock = blockListEl.querySelector('.block');
                if (firstBlock) {
                    firstBlock.focus();
                }
            }
        }

        function startEditing(block) {
            selectedBlockId = block.id;
            contentInput.value = block.content;
            isEditing = true;
            
            // Move focus to input
            contentInput.focus();
            contentLabel.setAttribute('aria-label', 'Editing block content');
            
            // Hide block list during editing
            blockListEl.style.display = 'none';
        }

        function finishEditing() {
            if (!isEditing) return;
            
            const content = contentInput.value.trim();
            if (content) {
                updateBlock(selectedBlockId, content).then(() => {
                    fetchBlocks();
                });
            } else {
                contentInput.value = '';
            }
            
            isEditing = false;
            selectedBlockId = null;
            
            // Re-render blocks
            fetchBlocks();
        }

        function deleteBlockAction(block) {
            if (!confirm(`Delete block "${block.content.substring(0, 30)}${block.content.length > 30 ? '...' : ''}"?`)) {
                return;
            }
            
            deleteBlock(block.id).then(() => {
                fetchBlocks();
            });
        }

        function showStatus(message, type = '') {
            statusMessage.textContent = message;
            statusMessage.className = 'status visible' + (type ? ' ' + type : '');
            setTimeout(() => {
                if (statusMessage.textContent === message) {
                    statusMessage.classList.remove('visible');
                }
            }, 3000);
        }

        // Event listeners
        addBlockBtn.addEventListener('click', () => {
            const content = prompt('Enter block content:', '');
            if (content !== null && content.trim()) {
                createBlock(content.trim()).then(() => fetchBlocks());
            }
        });

        saveBtn.addEventListener('click', finishEditing);

        deleteSelectedBtn.addEventListener('click', () => {
            if (selectedBlockId) {
                deleteBlockAction({ id: selectedBlockId, content: contentInput.value });
            } else {
                showStatus('Please select a block first.', 'error');
            }
        });

        contentInput.addEventListener('keydown', (e) => {
            if (isEditing) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    finishEditing();
                } else if (e.key === 'Escape') {
                    contentInput.value = '';
                    finishEditing();
                }
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const focused = document.activeElement;
            
            // Only handle if not editing
            if (!isEditing && focused !== addBlockBtn && focused !== saveBtn && 
                focused !== deleteSelectedBtn && focused !== contentInput &&
                !focused.classList.contains('block-action-btn')) {
                
                // Arrow key navigation
                if (['ArrowUp', 'ArrowDown'].includes(e.key)) {
                    const blocks = blockListEl.querySelectorAll('.block');
                    const currentIndex = Array.from(blocks).indexOf(document.activeElement);
                    
                    if (currentIndex === -1) return;
                    
                    let nextIndex = currentIndex;
                    if (e.key === 'ArrowUp') {
                        nextIndex = Math.max(0, currentIndex - 1);
                    } else if (e.key === 'ArrowDown') {
                        nextIndex = Math.min(blocks.length - 1, currentIndex + 1);
                    }
                    
                    const nextBlock = blocks[nextIndex];
                    if (nextBlock) {
                        e.preventDefault();
                        nextBlock.focus();
                    }
                }
            }

            // Enter/Space to select block when not editing
            if (!isEditing && ['Enter', ' '].includes(e.key)) {
                const focused = document.activeElement;
                if (focused.classList.contains('block')) {
                    e.preventDefault();
                    const block = focused;
                    selectedBlockId = block.dataset.blockId;
                    contentInput.value = blocks.find(b => b.id === selectedBlockId)?.content || '';
                    isEditing = true;
                    contentLabel.setAttribute('aria-label', 'Editing block content');
                    contentInput.focus();
                    blockListEl.style.display = 'none';
                }
            }

            // Delete/Backspace to delete selected block
            if (!isEditing && ['Delete', 'Backspace'].includes(e.key)) {
                const focused = document.activeElement;
                if (focused.classList.contains('block')) {
                    e.preventDefault();
                    deleteBlockAction(focused);
                } else if (selectedBlockId) {
                    const block = blocks.find(b => b.id === selectedBlockId);
                    if (block) {
                        deleteBlockAction({ id: selectedBlockId, content: block.content });
                    }
                }
            }

            // Escape to cancel editing
            if (isEditing && e.key === 'Escape') {
                e.preventDefault();
                finishEditing();
            }
        });

        // Add keyboard label when editing starts
        contentInput.addEventListener('focus', () => {
            if (isEditing) {
                contentLabel.textContent = 'Block Content:';
                contentLabel.setAttribute('aria-label', 'Editing block content');
            }
        });

        // Initialize
        fetchBlocks();
    </script>
</body>
</html>
