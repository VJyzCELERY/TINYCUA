<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Clock</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      font-family: sans-serif;
    }
    .clock {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    .center-dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="clock">
    <svg width="300" height="300" viewBox="0 0 300 300">
      <!-- Clock face -->
      <circle cx="150" cy="150" r="148" fill="#fff" stroke="#333" stroke-width="2"/>
      
      <!-- Numbers -->
      <text x="150" y="36" text-anchor="middle" font-size="20" fill="#333">12</text>
      <text x="274" y="81" text-anchor="end" font-size="20" fill="#333">3</text>
      <text x="274" y="186" text-anchor="end" font-size="20" fill="#333">6</text>
      <text x="24" y="186" text-anchor="start" font-size="20" fill="#333">9</text>
      
      <!-- Tick marks -->
      <g id="ticks"></g>
      
      <!-- Hour hand -->
      <line id="hour-hand" x1="150" y1="150" x2="150" y2="70" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Minute hand -->
      <line id="minute-hand" x1="150" y1="150" x2="150" y2="40" stroke="#666" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Second hand -->
      <line id="second-hand" x1="150" y1="150" x2="150" y2="30" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Center dot -->
      <circle cx="150" cy="150" r="5" fill="#333"/>
    </svg>
  </div>

  <script>
    function drawTicks() {
      const ticks = document.getElementById('ticks');
      const radius = 148;
      
      for (let i = 0; i < 60; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const outerRadius = i % 5 === 0 ? radius - 20 : radius - 10;
        const innerRadius = radius - 15;
        
        const x1 = 150 + outerRadius * Math.cos(angle);
        const y1 = 150 + outerRadius * Math.sin(angle);
        const x2 = 150 + innerRadius * Math.cos(angle);
        const y2 = 150 + innerRadius * Math.sin(angle);
        
        ticks.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'line'));
      }
    }
    
    function updateClock() {
      const now = new Date();
      
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();
      const totalSeconds = seconds + milliseconds / 1000;
      
      const minutes = now.getMinutes();
      const hours = now.getHours() % 12;
      
      // Calculate angles (positive, clockwise from 12 o'clock)
      const secondAngle = totalSeconds * 6;
      const minuteAngle = minutes * 6 + totalSeconds * 0.1;
      const hourAngle = hours * 30 + minutes * 0.5;
      
      // Update hands with rotation around center (150, 150)
      updateHand('second-hand', 150, 150, 150, 28, secondAngle);
      updateHand('minute-hand', 150, 150, 150, 34, minuteAngle);
      updateHand('hour-hand', 150, 150, 150, 46, hourAngle);
    }
    
    function updateHand(id, cx, cy, x, y, angle) {
      const hand = document.getElementById(id);
      if (!hand) return;
      
      // Rotate around center point (cx, cy)
      const cos = Math.cos(angle * Math.PI / 180);
      const sin = Math.sin(angle * Math.PI / 180);
      
      const endX = cx + cos * y;
      const endY = cy + sin * y;
      
      hand.setAttribute('x2', endX);
      hand.setAttribute('y2', endY);
    }
    
    function init() {
      drawTicks();
      updateClock();
      requestAnimationFrame(updateClock);
    }
    
    init();
  </script>
</body>
</html>
