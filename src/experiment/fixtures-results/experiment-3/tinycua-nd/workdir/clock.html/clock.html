<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <canvas id="clock" width="300" height="300"></canvas>
    <script>
        const canvas = document.getElementById('clock');
        const ctx = canvas.getContext('2d');

        function drawClock(handAngle, minuteAngle, hourAngle) {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Draw clock face (white circle)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 140, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw hour markers (12 positions)
            for (let i = 0; i < 12; i++) {
                const angle = (i * Math.PI) / 6 - Math.PI / 2;
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, 130, angle - 0.1, angle + 0.1);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = i % 3 === 0 ? 4 : 2;
                ctx.stroke();
            }

            // Draw hands
            drawHand(centerX, centerY, hourAngle, 60, '#000', 5);   // hour hand (black)
            drawHand(centerX, centerY, minuteAngle, 110, '#888', 4); // minute hand (gray)
            drawHand(centerX, centerY, secondAngle, 130, '#e00', 2); // second hand (red)

            // Draw center point
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();
        }

        function drawHand(centerX, centerY, angle, length, color, width) {
            const x = centerX + length * Math.cos(angle - Math.PI / 2);
            const y = centerY + length * Math.sin(angle - Math.PI / 2);
            
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Calculate rotation angles from current time
        const now = new Date();
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();
        
        // Calculate rotation angles from 12 o'clock position
        const secondAngle = seconds * 6; // seconds × 6°
        const minuteAngle = (minutes + seconds / 60) * 6; // (minutes + seconds/60) × 6°
        const hourAngle = ((hours % 12) + minutes / 60) * 30; // ((hours % 12) + minutes/60) × 30°

        drawClock(hourAngle, minuteAngle, secondAngle);

        // Update clock every second
        setInterval(() => {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();
            
            const secondAngle = seconds * 6;
            const minuteAngle = (minutes + seconds / 60) * 6;
            const hourAngle = ((hours % 12) + minutes / 60) * 30;

            drawClock(hourAngle, minuteAngle, secondAngle);
        }, 1000);
    </script>
</body>
</html>
