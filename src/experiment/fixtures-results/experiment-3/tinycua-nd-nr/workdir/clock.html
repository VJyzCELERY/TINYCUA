<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: Arial, sans-serif;
    }

    .clock-container {
      position: relative;
      width: 400px;
      height: 400px;
    }

    canvas {
      display: block;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <canvas id="clock" width="400" height="400"></canvas>
  </div>

  <script>
    // Canvas-based analog clock face drawing
    const canvas = document.getElementById('clock');
    const ctx = canvas.getContext('2d');

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 180;

    // Time-to-rotation calculation logic using Date API and setInterval
    let hourRotation = 0;
    let minuteRotation = 0;
    let secondRotation = 0;

    function calculateTimeRotations() {
      const now = new Date();
      
      // Get hours (0-23), convert to 12-hour format for clock face
      let hours = now.getHours() % 12;
      if (hours === 0) hours = 12;
      
      // Hours: ×30° + offset (each hour is 30°, plus offset for position within hour)
      hourRotation = (hours * 30) + ((now.getMinutes() / 60) * 30);
      
      // Minutes: ×6° + offset (each minute is 6°, plus offset for position within second)
      minuteRotation = (now.getMinutes() * 6) + ((now.getSeconds() / 60) * 6);
      
      // Seconds: ×6°
      secondRotation = now.getSeconds() * 6;
    }

    function drawClockFace() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw clock face circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 10;
      ctx.stroke();

      // Draw tick marks for all 60 minutes
      const tickSize = 10;
      const innerTickSize = 5;
      const tickGap = 8;

      for (let i = 0; i < 60; i++) {
        const angle = (i * 6) * Math.PI / 180; // 6 degrees per minute
        const x = centerX + Math.cos(angle) * (radius - tickGap);
        const y = centerY + Math.sin(angle) * (radius - tickGap);

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius - tickGap, angle, angle + Math.PI / 30, false);
        ctx.stroke();

        // Draw tick marks
        const isHourMark = i % 5 === 0;
        const tickLength = isHourMark ? tickSize : innerTickSize;
        const x1 = centerX + Math.cos(angle) * (radius - tickGap - tickLength / 2);
        const y1 = centerY + Math.sin(angle) * (radius - tickGap - tickLength / 2);

        ctx.beginPath();
        ctx.arc(centerX, centerY, radius - tickGap, angle, angle + Math.PI / 30, false);
        ctx.stroke();

        // Draw hour number labels
        if (i % 5 === 0) {
          const hour = i === 0 ? 12 : i;
          const labelRadius = radius - tickGap - 40;
          const labelX = centerX + Math.cos(angle) * labelRadius;
          const labelY = centerY + Math.sin(angle) * labelRadius;

          ctx.font = 'bold 24px Arial';
          ctx.fillStyle = '#333';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(hour.toString(), labelX, labelY);
        }
      }

      // Draw center circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#333';
      ctx.fill();

      // Draw hour hand
      drawClockHand(ctx, centerX, centerY, radius, 0.5, 7, '#333', 0.5);

      // Draw minute hand
      drawClockHand(ctx, centerX, centerY, radius, 0.8, 10, '#333', 0.6);

      // Draw second hand
      drawClockHand(ctx, centerX, centerY, radius, 0.9, 12, '#e74c3c', 0.5);
    }

    function drawClockHand(ctx, centerX, centerY, radius, lengthRatio, thickness, color, baseWidthRatio) {
      // Calculate hand dimensions based on clock size
      const handLength = radius * lengthRatio;
      const handThickness = (handThickness === 0.9) ? 2 : 4; // Second hand is thinner

      ctx.save();
      ctx.translate(centerX, centerY);
      
      // Draw hour hand
      drawHand(ctx, 0, handLength, handThickness, color, baseWidthRatio);

      ctx.restore();
    }

    function drawHand(ctx, rotation, length, thickness, color, lineWidth) {
      ctx.save();
      ctx.rotate(rotation);
      
      // Draw the hand as a rectangle centered at pivot
      const halfLength = length / 2;
      const halfWidth = thickness / 2;
      
      ctx.beginPath();
      ctx.rect(-halfLength, -halfWidth, length, thickness);
      ctx.fillStyle = color;
      ctx.fill();
      
      ctx.restore();
    }

    function animate() {
      calculateTimeRotations();
      drawClockFace();
      requestAnimationFrame(animate);
    }

    // Start the animation loop
    animate();
  </script>
</body>
</html>
