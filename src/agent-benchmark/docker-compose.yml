version: '3.8'

services:
  # ============= SHARED INFRASTRUCTURE =============
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-changeme}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============= AGENT SERVICES =============
  hermes:
    image: ghcr.io/nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - ./workspace:/workspace
      - ./output:/output
      - hermes-data:/home/node/.hermes
    environment:
      HERMES_AUTH_TOKEN: ${HERMES_AUTH_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-${PROVIDER_API_KEY:-}}
      HERMES_MODEL: ${PROVIDER_MODEL:-qwen3.5-9b}
      HERMES_BASE_URL: ${PROVIDER_BASE_URL:-http://host.docker.internal:1234/v1}
      HERMES_TEMPERATURE: "0.0"
      HERMES_MAX_TOKENS: "4096"
      TASK_PROMPT: ${TASK_PROMPT:-}
      LLM_API_BASE: ${PROVIDER_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${PROVIDER_API_KEY:-}
      LLM_MODEL: ${PROVIDER_MODEL:-qwen3.5-9b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  opencode:
    image: ghcr.io/pilinux/opencode:latest
    container_name: opencode_agent
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:4096:4096"
    volumes:
      - ./config:/root/.config/opencode
      - ./workspace:/workspace
      - ./output:/output
    environment:
      OPENCODE_HOSTNAME: "0.0.0.0"
      OPENCODE_PORT: "4096"
      OPENCODE_MODEL: ${PROVIDER_MODEL:-qwen3.5-9b}
      OPENCODE_API_BASE: ${PROVIDER_BASE_URL:-http://host.docker.internal:1234/v1}
      OPENCODE_TEMPERATURE: "0.0"
      OPENCODE_MAX_TOKENS: "4096"
      TASK_PROMPT: ${TASK_PROMPT:-}
      LLM_API_BASE: ${PROVIDER_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${PROVIDER_API_KEY:-}
      LLM_MODEL: ${PROVIDER_MODEL:-qwen3.5-9b}
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_TOKENS: "4096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace

  openclaw-gateway:
    image: openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
    shm_size: '1gb'
    volumes:
      - ./openclaw-data:/home/node/.openclaw
      - ./openclaw-workspace:/home/node/.openclaw/workspace
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      NODE_ENV: production
      TASK_PROMPT: ${TASK_PROMPT:-}
      LLM_API_BASE: ${PROVIDER_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${PROVIDER_API_KEY:-}
      LLM_MODEL: ${PROVIDER_MODEL:-qwen3.5-9b}
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_TOKENS: "4096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 4gb

  openclaw-cli:
    image: openclaw/openclaw:latest
    container_name: openclaw-cli
    network_mode: "service:openclaw-gateway"
    profiles:
      - admin
    volumes:
      - ./openclaw-data:/home/node/.openclaw
      - ./openclaw-workspace:/home/node/.openclaw/workspace
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}

volumes:
  hermes-data:
