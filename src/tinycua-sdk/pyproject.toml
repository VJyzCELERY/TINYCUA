[project]
name = "tinycua-sdk"
version = "0.1.0"
description = "TINYCUA SDK - AI Agent Development Kit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-ai-sdk>=0.0.3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
postgres = [
    "pgvector>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pre-commit>=3.0.0",
    "radon>=6.0.0",
]
lint = [
    "ruff>=0.3.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "D", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
ignore = [
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "E501",  # Line too long (handled separately)
    "D401",  # First line not imperative mood (docstring style)
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]
"examples/**" = ["D"]
"specs/**" = ["D"]
"docs/**" = ["D"]
"**/02_skills_creation.py" = ["E402"]
"**/02_public_api_clean.py" = ["F403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings --maxfail=2"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require external service running)",
    "lm_studio: marks tests that require local OpenAI-compatible server running",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.3.0",
]
