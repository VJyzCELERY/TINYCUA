[project]
name = "tinycua-finetune"
version = "0.1.0"
description = "TINYCUA Finetune - Fine-tuning pipeline"
requires-python = ">=3.12"
dependencies = [
    "tinycua-sdk @ git+https://github.com/VJyzCELERY/TINYCUA.git#subdirectory=src/tinycua-sdk",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "trl>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tinycua_finetune"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "D", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
ignore = [
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "E501",  # Line too long
    "D401",  # First line not imperative mood
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]
"examples/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings --maxfail=2 --cov=tinycua_finetune --cov-report=html"
