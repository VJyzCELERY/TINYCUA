# Docker Compose for Hermes Benchmark Local Development
# See src/hermes-benchmark/docs/SETUP.md for usage instructions

services:
  hermes-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-benchmark:latest
    container_name: hermes-benchmark
    volumes:
      - ./workspace:/tmp_workspace
    environment:
      # Required: Local model endpoint (adjust to your setup)
      - HERMES_BASE_URL=http://host.docker.internal:1234/v1
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-qwen3.5-9b}

      # Required: WildClawBench task prompt (set by benchmark harness)
      - TASK_PROMPT=${TASK_PROMPT:?Set TASK_PROMPT to the WildClawBench task prompt before running}

      # Optional: Tool API keys
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}

      # Optional: Runtime configuration
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-INFO}
      - HERMES_TIMEOUT=${HERMES_TIMEOUT:-300}
    # For Linux: allow container to reach host model endpoints
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Ensure container runs and exits (not daemonized for one-shot tasks)
    stdin_open: true
    tty: true
