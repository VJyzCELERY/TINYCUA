services:
  postgres:
    image: postgres:17.4-alpine
    container_name: tinycua-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinycua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-tinycua}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tinycua}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
