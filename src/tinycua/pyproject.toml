[project]
name = "tinycua"
version = "0.1.0"
description = "TINYCUA - Computer-Use Agent CLI Application"
requires-python = ">=3.12"
dependencies = [
    "tinycua-sdk @ file:../tinycua-sdk",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "radon>=6.0.0",
    "pytest-asyncio>=0.23.0",
]
tui = [
    "textual>=0.50.0",
]
cua = [
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
]

[project.scripts]
tinycua = "tinycua.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "D", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
ignore = [
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "E501",  # Line too long (handled separately)
    "D401",  # First line not imperative mood (docstring style)
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --disable-warnings --maxfail=2"

[tool.hatch.metadata]
allow-direct-references = true
